note: >-
  Advanced Navigation publishes no changelog page. The Kinematica API's change history is published as
  two dated tables inside the API reference manual itself — section 1 "Document History" and section 2
  "API Software History", the latter tracking the server software version against the API version it
  serves. Recorded here verbatim from document v1.6 (06/01/2026). Device firmware changelogs are
  likewise carried inside each product's reference manual PDF rather than on a page ("The change log
  can be found in the Boreas reference manual").
