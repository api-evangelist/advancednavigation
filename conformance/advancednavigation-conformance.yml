domain_standards:
- id: rinex
  conforms: true
  scope: data formats consumed and produced, not an API standard
  evidence: >-
    The Kinematica API accepts RINEX observation and navigation files by their standard extensions
    (.o, .d, .o.Z, .d.Z for rover and base station; n, g, p for ephemeris) and can auto-select a base
    station "using RINEX file" (section 6.2.3). RINEX is the international GNSS data interchange
    standard, so a customer already holding RINEX data integrates without a bespoke converter.
- id: gpx
  conforms: true
