aid: advancednavigation
name: Advanced Navigation
description: Advanced Navigation is an Australian navigation and robotics manufacturer (Sydney, NSW) building
  inertial navigation systems (INS), IMU/AHRS, GNSS compasses, acoustic/USBL subsea positioning and underwater
  robotics for air, land, sea and space — the Boreas FOG and Certus MEMS GNSS/INS families, Motus, GNSS
  Compass, Subsonus USBL, Subsonus Tag and the Hydrus micro-AUV, plus the Chimera laser velocity sensor
  and Air Data Unit aiding accessories. Its devices speak the proprietary binary Advanced Navigation Packet
  Protocol (ANPP), documented in per-product reference manuals and implemented by first-party C SDKs,
  a Python SDK on PyPI and ROS 1 / ROS 2 drivers. Its one public web API is the Kinematica API — an HTTP/JSON
  interface to the Kinematica cloud GNSS/INS post-processing (PPK) service, documented as a versioned
  PDF reference manual rather than a machine-readable specification.
