apis:
- aid: advancednavigation:advancednavigation-kinematica
  name: Kinematica API
  description: HTTP/JSON API for Advanced Navigation's Kinematica cloud GNSS/INS post-processing kinematic
    (PPK) service. Eleven documented calls let a customer application create a data set, upload primary
    and secondary rover files (.anpp, .o, .d, .o.Z, .d.Z), supply or auto-select base-station and ephemeris
    files, edit the processing configuration, queue processing, poll status and logs, list files and download
    post-processed results. Authenticated with a per-account API key passed as a request parameter; replies
    are JSON. API version v1.2; the API tier is sold as pay-as-you-go processing minutes.
  humanURL: https://www.advancednavigation.com/accessories/gnss-ins-post-processing/kinematica/
